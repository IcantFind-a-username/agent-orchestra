[project]
name = "agent-orchestra"
version = "0.1.0"
description = "Durable, auditable multi-stage orchestration core for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/IcantFind-a-username/agent-orchestra"
Issues = "https://github.com/IcantFind-a-username/agent-orchestra/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

# Run straight from the source tree; nothing is installed into site-packages.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests", "conftest.py"]
